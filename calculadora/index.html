<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculadora">
        <input type="text" disabled id="visor" value=''>
        <div class="botoens">
            <button onclick="limpar()">c</button>
            <button onclick="voltar()">&lt</button>
            <button onclick="inseririr_visor('/')">/</button>
            <button onclick="inseririr_visor('*')">*</button>
            <button onclick="inseririr_visor('7')">7</button>
            <button onclick="inseririr_visor('8')">8</button>
            <button onclick="inseririr_visor('9')">9</button>
            <button onclick="inseririr_visor('-')">-</button>
            <button onclick="inseririr_visor('4')">4</button>
            <button onclick="inseririr_visor('5')">5</button>
            <button onclick="inseririr_visor('6')">6</button>
            <button onclick="inseririr_visor('+')">+</button>
            <button onclick="inseririr_visor('1')">1</button>
            <button onclick="inseririr_visor('2')">2</button>
            <button onclick="inseririr_visor('3')">3</button>
            <button class="zero"  onclick="inseririr_visor('0')">0</button>
            <button onclick="inseririr_visor('.')">.</button>
            <button class="igual" onclick="inseririr_visor('=')">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
